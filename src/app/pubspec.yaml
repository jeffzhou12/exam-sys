name: exam_system
description: "ExamSystem 考试系统移动端 App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 网络 ─────────────────────────────────────────────────────────────────
  dio: ^5.4.3
  pretty_dio_logger: ^1.4.0

  # ── 路由 ─────────────────────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── 状态管理 ──────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── 安全存储（Token → iOS Keychain / Android EncryptedSharedPreferences）
  flutter_secure_storage: ^10.2.0

  # ── 本地偏好设置 ──────────────────────────────────────────────────────────
  shared_preferences: ^2.3.0

  # ── 国际化 / 日期格式化 ────────────────────────────────────────────────────
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # ── UI 辅助 ────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
  #       - asset: assets/fonts/NotoSansSC-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansSC-Bold.ttf
  #         weight: 700
