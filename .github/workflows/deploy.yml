name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'force backend deploy'
        type: boolean
        default: false
      force_frontend:
        description: 'force frontend deploy'
        type: boolean
        default: false
      force_portal:
        description: 'force portal deploy'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:      ap-southeast-1
  ECR_REPOSITORY:  exam-prod
  ECS_CLUSTER:     exam-prod
  ECS_SERVICE:     exam-prod
  CONTAINER_NAME:  exam-prod
  APP_PORT:        "8080"
  DOTNET_VERSION:  "8.0.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      portal:   ${{ steps.filter.outputs.portal }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'Dockerfile'
              - 'ExamSystem.slnx'
              - 'db/**'
            frontend:
              - 'src/web/admin/**'
            portal:
              - 'src/web/portal/**'

  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || inputs.force_backend == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore src/api/ExamSystem.API/ExamSystem.API.csproj
      - name: Build
        run: dotnet build src/api/ExamSystem.API/ExamSystem.API.csproj --no-restore -c Release

  deploy:
    name: Build Image and Deploy Backend
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    if: ${{ needs.changes.outputs.backend == 'true' || inputs.force_backend == true }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build tag and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            --cache-from "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            > task-definition.json
      - name: Render updated ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ steps.build-image.outputs.image }}
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ env.ECS_SERVICE }}
          cluster:                    ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-admin:
    name: Build and Deploy Admin Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || inputs.force_frontend == true }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/admin/package-lock.json
      - name: Install dependencies
        working-directory: src/web/admin
        run: npm ci
      - name: Build frontend
        working-directory: src/web/admin
        env:
          VITE_API_BASE_URL: /api
          VITE_ADMIN_BASE_PATH: ${{ vars.ADMIN_BASE_PATH || secrets.ADMIN_BASE_PATH || '/' }}
          VITE_PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL || secrets.PORTAL_BASE_URL || 'https://d2a95y8zxdxfqo.cloudfront.net/' }}
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Sync assets to S3
        run: |
          aws s3 sync src/web/admin/dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"
      - name: Upload index.html
        run: |
          aws s3 cp src/web/admin/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-portal:
    name: Build and Deploy Portal Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.portal == 'true' || inputs.force_portal == true }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/portal/package-lock.json
      - name: Install dependencies
        working-directory: src/web/portal
        run: npm ci
      - name: Build portal
        working-directory: src/web/portal
        env:
          VITE_API_BASE_URL: /api
          VITE_ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || secrets.ADMIN_BASE_URL || 'https://d165uf1arxthuu.cloudfront.net/' }}
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Sync assets to S3
        run: |
          aws s3 sync src/web/portal/dist/ s3://${{ secrets.S3_BUCKET_NAME_PORTAL }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"
      - name: Upload index.html
        run: |
          aws s3 cp src/web/portal/dist/index.html s3://${{ secrets.S3_BUCKET_NAME_PORTAL }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PORTAL }} \
            --paths "/*"
