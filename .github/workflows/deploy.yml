name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_backend:
        description: '强制发布后台'
        type: boolean
        default: false
      force_frontend:
        description: '强制发布前端'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:      ap-southeast-1
  ECR_REPOSITORY:  exam-prod
  ECS_CLUSTER:     exam-prod
  ECS_SERVICE:     exam-prod
  CONTAINER_NAME:  exam-prod
  APP_PORT:        "8080"
  DOTNET_VERSION:  "8.0.x"

jobs:
  # ── 检测变更范围 ──────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'Dockerfile'
              - 'ExamSystem.slnx'
              - 'db/**'
            frontend:
              - 'web/admin/**'

  # ── 后台：编译检查 ────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || inputs.force_backend == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/ExamSystem.API/ExamSystem.API.csproj

      - name: Build
        run: dotnet build src/ExamSystem.API/ExamSystem.API.csproj --no-restore -c Release

  # ── 后台：构建镜像并部署 ECS ───────────────────────────────────────────────────
  deploy:
    name: Build Image & Deploy (Backend)
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    if: ${{ needs.changes.outputs.backend == 'true' || inputs.force_backend == true }}
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS 认证（OIDC，无长期凭证）────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # ── 登录 ECR ─────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 构建并推送 Docker 镜像 ───────────────────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            --cache-from "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # ── 运行 EF Core 数据库迁移（通过 ECS Run Task）──────────────────────────
      - name: Run EF Core migrations
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_SERVICE" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET_ID }}],securityGroups=[${{ secrets.ECS_SG_ID }}],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"dotnet\",\"ef\",\"database\",\"update\",\"--project\",\"ExamSystem.Infrastructure\",\"--startup-project\",\"ExamSystem.API\"],\"image\":\"$IMAGE\"}]}" \
            --query 'tasks[0].taskArn' \
            --output text || true

      # ── 获取当前任务定义 ─────────────────────────────────────────────────────
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            > task-definition.json

      # ── 注入新镜像 ───────────────────────────────────────────────────────────
      - name: Render updated ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ steps.build-image.outputs.image }}

      # ── 部署到 ECS ───────────────────────────────────────────────────────────
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ env.ECS_SERVICE }}
          cluster:                    ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ── 前端：构建并部署 S3 + CloudFront ──────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || inputs.force_frontend == true }}
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        working-directory: web/admin
        run: npm ci

      - name: Build frontend
        working-directory: web/admin
        run: npm run build
        # VITE_API_BASE_URL 留空，生产走 /api 相对路径（CloudFront 转发至 ALB）

      # ── AWS 认证（复用同一 OIDC 角色）──────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # ── 上传静态资源（长缓存）───────────────────────────────────────────────
      - name: Sync assets to S3 (long cache)
        run: |
          aws s3 sync web/admin/dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

      # ── 上传 index.html（禁用缓存）─────────────────────────────────────────
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp web/admin/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # ── CloudFront 缓存失效 ─────────────────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/ExamSystem.API/ExamSystem.API.csproj

      - name: Build
        run: dotnet build src/ExamSystem.API/ExamSystem.API.csproj --no-restore -c Release

  deploy:
    name: Build Image & Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS 认证（OIDC，无长期凭证）────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # ── 登录 ECR ─────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 构建并推送 Docker 镜像 ───────────────────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            --cache-from "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # ── 运行 EF Core 数据库迁移（通过 ECS Run Task）──────────────────────────
      - name: Run EF Core migrations
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_SERVICE" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET_ID }}],securityGroups=[${{ secrets.ECS_SG_ID }}],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"dotnet\",\"ef\",\"database\",\"update\",\"--project\",\"ExamSystem.Infrastructure\",\"--startup-project\",\"ExamSystem.API\"],\"image\":\"$IMAGE\"}]}" \
            --query 'tasks[0].taskArn' \
            --output text || true

      # ── 获取当前任务定义 ─────────────────────────────────────────────────────
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            > task-definition.json

      # ── 注入新镜像 ───────────────────────────────────────────────────────────
      - name: Render updated ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ steps.build-image.outputs.image }}

      # ── 部署到 ECS ───────────────────────────────────────────────────────────
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ env.ECS_SERVICE }}
          cluster:                    ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        working-directory: web/admin
        run: npm ci

      - name: Build frontend
        working-directory: web/admin
        run: npm run build
        # VITE_API_BASE_URL 留空，生产走 /api 相对路径（CloudFront 转发至 ALB）

      # ── AWS 认证（复用同一 OIDC 角色）──────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # ── 上传静态资源（长缓存）───────────────────────────────────────────────
      - name: Sync assets to S3 (long cache)
        run: |
          aws s3 sync web/admin/dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

      # ── 上传 index.html（禁用缓存）─────────────────────────────────────────
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp web/admin/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # ── CloudFront 缓存失效 ─────────────────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

